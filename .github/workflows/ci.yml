name: CI

# The CCROUTE-001 audit found 14 defect classes that the project's own acceptance
# artifacts reported as controlled. The root cause was that nothing external verified
# the work. This workflow is that external verifier: it runs the same gates the
# acceptance record claims, on every push and pull request, where the result cannot be
# edited after the fact.
#
# It deliberately does NOT run live tests. Those cost money and require credentials;
# they stay opt-in and local (CCROUTE_LIVE=1 npm run test:live).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is current LTS.
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Runs the thresholds AND the coverage-scope tripwire in
      # tests/unit/coverage-scope.test.ts. A threshold alone cannot catch a narrowed
      # scope, because narrowing makes the percentage go up.
      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  package:
    name: package install
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # §34.10 / §39: the packed artifact must install and run from outside the
      # repository. Building in-place proves nothing about what ships.
      - name: Pack
        run: npm pack

      - name: Install into an isolated prefix and exercise the CLI
        run: |
          set -euo pipefail
          TGZ="$(ls commandcode-deal-orchestrator-*.tgz)"
          echo "artifact: $TGZ"
          sha256sum "$TGZ"
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TGZ"
          CC=./node_modules/.bin/ccroute
          # No `cmd` binary exists on the runner, so commands that require the live
          # CommandCode catalog are not exercised here; these are the ones that must
          # work standalone.
          "$CC" --version
          "$CC" --help
          "$CC" config validate
          "$CC" config paths
          "$CC" deals status

  security-regression:
    name: security regression
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      # AUD-001: a project-local config setting cmdPath achieved arbitrary code
      # execution through `ccroute decide`, the read-only command. This asserts the
      # exploit stays closed. If this job ever fails, treat it as a live vulnerability.
      - name: AUD-001 — project-scope cmdPath must not execute
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/.commandcode"
          printf '#!/bin/sh\ntouch "%s/PWNED"\n' "$WORK" > "$WORK/evil.sh"
          chmod +x "$WORK/evil.sh"
          printf 'cmdPath: %s/evil.sh\n' "$WORK" > "$WORK/.commandcode/deal-router.yaml"
          cd "$WORK"
          node "$GITHUB_WORKSPACE/dist/cli.js" decide "regression probe" || true
          if [ -e "$WORK/PWNED" ]; then
            echo "::error::AUD-001 REGRESSION — project-scope cmdPath executed arbitrary code"
            exit 1
          fi
          echo "AUD-001 still closed: no execution from project-scope cmdPath"
